appId: com.pdfx.app
productName: PDFx
directories:
  buildResources: build
# Chromium locale packs: keep the UI languages we care about, drop ~40 others.
electronLanguages:
  - en-US
  - ru
files:
  - '**/*'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{vitest.config.ts,vite.config.web.ts,dev-vars.ts}'
  - '!.github/**'
  - '!e2e/**'
  - '!{.prettierignore,.prettierrc.yaml,.editorconfig,dev-app-update.yml,README.md,SPEC.md}'
  - '!{.env,.env.*,.dev.vars,.dev.vars.example,.npmrc,pnpm-lock.yaml,yarn.lock}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!scripts/**'
  - '!native/**'
  - 'native/build/Release/*.node'
  - '!resources/**'
asarUnpack:
  - native/build/Release/*.node
extraResources:
  - from: resources/ocr
    to: ocr
  - from: resources/pdf
    to: pdf
fileAssociations:
  - ext: pdfx
    name: PDFX Collection
    description: PDFX multi-document PDF collection
    mimeType: application/x-pdfx
    role: Viewer
mac:
  category: public.app-category.productivity
win:
  executableName: pdfx
  # Portable only: unpack the ZIP and run pdfx.exe. No installer, no registry,
  # settings and sessions go to the `data` folder next to the executable.
  artifactName: PDFx-Windows-Portable.${ext}
  target:
    - target: zip
      arch:
        - x64
  extraFiles:
    - from: build/win/portable
      to: '.'
    # version.json from scripts/stamp-version.mjs: what the updater compares.
    - from: build/stamp
      to: '.'
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Office
  maintainer: Alex Gounis <gounisalex@gmail.com>
  synopsis: One file. Many documents. Still a PDF.
  description: An open, backwards-compatible PDF extension that bundles many documents into one valid PDF, plus a minimal desktop viewer that splits it back into the original files.
deb:
  afterInstall: &after-install build/linux/after-install.tpl
rpm:
  afterInstall: *after-install
flatpak:
  runtimeVersion: '23.08'
  baseVersion: '23.08'
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
